name: td-verify-host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 用同一把 API key 验用户给的域名
        env:
          KEY: ${{ secrets.TELDRIVE_API_KEY }}
        run: |
          set +e
          U="https://sparkling-snow-5pg38nh4.sin.unikraft.app"
          echo "=== 该域名 /api/v1/me ==="
          curl -s -o /tmp/m.json -w 'status=%{http_code} time=%{time_total}s\n' \
            --max-time 40 -H "X-Api-Key: $KEY" "$U/api/v1/me"
          head -c 300 /tmp/m.json; echo
          echo ""
          echo "=== 该域名 /api/v1/channels ==="
          curl -s -o /tmp/c.json -w 'status=%{http_code} time=%{time_total}s\n' \
            --max-time 40 -H "X-Api-Key: $KEY" "$U/api/v1/channels"
          head -c 400 /tmp/c.json; echo
