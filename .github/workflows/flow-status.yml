name: flow-status

# 云流程状态总览: 扫描所有流程的 Actions 运行 -> 判定状态 -> 抓失败日志提错误行
#   -> 画成状态图(SVG->PNG) -> 发到 Telegram
# 需要 Secrets: TG_TOKEN / TG_CHAT_ID / GH_TOKEN / GH_TOKEN_TAM(可选, 私有仓库用)
#              + PATHS_JSON(带盘名的功能说明/失败建议/分组标题都从它读)

on:
  # 每 6 小时 (UTC 20 0/6/12/18 = 北京 8:20/14:20/20:20/次日 2:20)
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      text_only:
        description: "true=不发图片, 只发文字摘要"
        required: false
        default: "false"

concurrency:
  group: flow-status
  cancel-in-progress: false

permissions:
  contents: read

env:
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN_TAM: ${{ secrets.GH_TOKEN_TAM }}
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  # 容量区用: 挂载清单(含各存储凭证)。采不到就整段跳过, 不影响状态判定。
  ALIST_STORAGES_TY: ${{ secrets.ALIST_STORAGES_TY }}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装中文字体 + SVG 转 PNG 工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk librsvg2-bin
          rsvg-convert --version

      - name: 装 rclone(容量区要读远端配额)
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "配置里的远端: $(grep -c '^\[' ~/.config/rclone/rclone.conf) 段"

      - name: 扫描 + 出图 + 发 Telegram
        run: |
          ARGS=""
          if [ "${{ inputs.text_only }}" = "true" ]; then ARGS="--text-only"; echo "(只发文字)"; fi
          python3 tools/flow_status.py $ARGS
