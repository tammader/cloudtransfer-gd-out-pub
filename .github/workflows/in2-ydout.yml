name: in2-ydout

# 中转远端 in2 目录里「已标记 _D」的分卷 -> 目标远端 ydout 目录
#   跨网盘没有 server-side copy, 由 rclone 自动「下载到 runner -> 上传到目标」;
#   只在**目标端同名同大小**确认送达后, 才删除源文件(进回收站可捞)。
#   分批搬运, 到时间预算优雅收工, 剩下的下一轮继续。
# 需要仓库 Secrets: RCLONE_CONF(两端配置) / PATHS_JSON(盘名/目录名真值)

on:
  # 每 6 小时 (UTC 45 0/6/12/18 = 北京 8:45/14:45/20:45/次日 2:45); 与 od2-dbjm(:15) 错开
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真搬(上传+删源), false=只演练"
        required: false
        default: "false"
      max_ops:
        description: "本轮最多处理多少个文件"
        required: false
        default: "200"
      max_total_gb:
        description: "本轮总量上限(GB)"
        required: false
        default: "150"
      batch_gb:
        description: "每批搬运量上限(GB)"
        required: false
        default: "8"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      only:
        description: "只处理名字含该子串的文件(留空=全部); 验证时有用"
        required: false
        default: ""

concurrency:
  group: in2-ydout
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 盘名/目录名的真值走加密 Secret; 日志里只会显示 ***
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1
          df -h / | tail -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"

      - name: 跑搬运(仅 _D 文件 -> 目标远端, 送达后删源)
        env:
          # schedule 触发时 inputs.apply 为空 -> 自动真跑; 手动触发默认演练
          APPLY: ${{ inputs.apply || 'true' }}
          MAX_OPS: ${{ inputs.max_ops || '200' }}
          MAX_TOTAL_GB: ${{ inputs.max_total_gb || '150' }}
          BATCH_GB: ${{ inputs.batch_gb || '8' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          ONLY_NAME: ${{ inputs.only }}
        run: |
          set -e
          ARGS="--mode in2-ydout --max-ops $MAX_OPS --max-total-gb $MAX_TOTAL_GB"
          ARGS="$ARGS --batch-gb $BATCH_GB --budget-min $BUDGET_MIN"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; else echo "(演练模式)"; fi
          python3 tools/gd_relay.py $ARGS
