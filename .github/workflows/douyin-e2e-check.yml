name: douyin-e2e-check

# 分级尺寸测试: 找出 Unikraft 网关单传上限。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 装补丁版 rclone
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rdl
          gh release download td-rclone-v1.75.4 --repo tammader/cloudtransfer-gd-out \
            --pattern 'rclone-linux-amd64' --dir /tmp/rdl --clobber
          sudo install -m 0755 /tmp/rdl/rclone-linux-amd64 /usr/local/bin/rclone
          rclone help backend teldrive > /dev/null && echo "teldrive backend OK"

      - name: 添加 teldrive 远端
        env:
          TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
          TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
        run: |
          rclone config create teldrive teldrive \
            api_host="$TELDRIVE_API_HOST" api_key="$TELDRIVE_API_KEY" > /dev/null
          rclone lsd teldrive: 2>&1 | head -7

      - name: 分级尺寸上传
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DY_WORK: /tmp/dywork
          DY_TD_DST: teldrive:douyin-graded
          DOUYIN_FAV_JSON: /tmp/dy.json
          TD_CHUNK: "4Mi"
          TD_UP_CONC: "4"
        run: |
          set -euo pipefail
          cp tools/_dy_graded.json /tmp/dy.json
          python3 tools/douyin_teldrive.py --apply --max-files 10 --budget-min 45 --max-total-gb 1 --preview 10
          echo "=== 目标端回读 ==="
          rclone lsjson teldrive:douyin-graded -R --files-only 2>&1 | head -20
