name: gd2-od2-copy

# 迁移盘上的 onedrive 目录 -> 目标远端: 跨盘「拷贝」(源端只读, 不删不移)。
#
#   * 目标盘退役时它的内容被整体搬到了 迁移盘/onedrive 目录下; 这条流程把那份数据拷回目标盘,
#     目录形状一致 -> 拷回去就是还原原来的布局。
#   * 跨盘没有 server-side copy, rclone 自动「下载到 runner -> 上传到目标」。
#   * 目标端「同名 + 字节数一致」= 已送到 -> 跳过, 所以**可以反复跑**(幂等), 中断了接着跑。
#   * 每批搬完立即校验(同名同大小才算送达), 校验不过的留到下一轮。
#   * 目录级/文件级都按 --only 过滤; 顺序可选 size-asc(先出小成果)。
#   * 默认演练; 定时触发才是真拷。报告落 目标盘:报告区/gd2_od2_report.txt。
# 需要仓库 Secrets: RCLONE_CONF(两端配置) / PATHS_JSON(GO_SRC,GO_DST,GO_REPORT,GO_FAILED)

on:
  # 每 6 小时 (UTC 20 0/6/12/18 = 北京 8:20/14:20/20:20/次日 2:20); 与 od2-dbjm(:15) 错开
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真拷(下载+上传), false=只演练看计划"
        required: false
        default: "false"
      max_total_gb:
        description: "本轮处理文件总量上限(GB); 0=不限, 放开后基本由时间决定"
        required: false
        default: "0"
      batch_gb:
        description: "每批搬运量上限(GB)"
        required: false
        default: "8"
      disk_budget_gb:
        description: "每批磁盘上限(GB); 0=按 runner 剩余空间自动算(留 reserve_gb)"
        required: false
        default: "0"
      reserve_gb:
        description: "给系统留的磁盘余量(GB)"
        required: false
        default: "2"
      budget_min:
        description: "本轮时间预算(分钟), 到点收工下次继续(350 是 job 上限, 310 留余量)"
        required: false
        default: "310"
      order:
        description: "处理顺序: name / size-asc / size-desc"
        required: false
        default: "name"
      only:
        description: "只处理相对路径含该子串的文件(留空=全部); 验证时有用"
        required: false
        default: ""

concurrency:
  group: gd2-od2-copy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 盘名/目录名的真值走加密 Secret; 日志里只会显示 ***
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 环境自检(磁盘/内存)
        run: |
          echo "===== 磁盘 ====="; df -h / /tmp 2>/dev/null || df -h /
          echo "===== CPU/内存 ====="; nproc; free -h || true

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "配置里的远端: $(grep -c '^\[' ~/.config/rclone/rclone.conf) 段"

      - name: 跑拷贝(迁移盘/onedrive -> 目标远端, 源端只读)
        env:
          # schedule 触发时 inputs.apply 为空 -> 自动真拷; 手动触发默认演练
          APPLY: ${{ inputs.apply || 'true' }}
          MAX_TOTAL_GB: ${{ inputs.max_total_gb || '0' }}
          BATCH_GB: ${{ inputs.batch_gb || '8' }}
          DISK_BUDGET_GB: ${{ inputs.disk_budget_gb || '0' }}
          RESERVE_GB: ${{ inputs.reserve_gb || '2' }}
          BUDGET_MIN: ${{ inputs.budget_min || '310' }}
          ORDER: ${{ inputs.order || 'name' }}
          ONLY: ${{ inputs.only || '' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          ARGS="--max-total-gb $MAX_TOTAL_GB --batch-gb $BATCH_GB --order $ORDER"
          ARGS="$ARGS --disk-budget-gb $DISK_BUDGET_GB --reserve-gb $RESERVE_GB"
          ARGS="$ARGS --budget-min $BUDGET_MIN"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; else echo "(演练模式)"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python3 tools/gd2_od2_copy.py $ARGS

      - name: 收尾(报剩余空间)
        if: always()
        run: df -h / | tail -1
