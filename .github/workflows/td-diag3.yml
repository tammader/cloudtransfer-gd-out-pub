name: td-diag3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: jobs 全量
        env:
          HOST: ${{ secrets.TELDRIVE_API_HOST }}
          KEY: ${{ secrets.TELDRIVE_API_KEY }}
        run: |
          set +e
          curl -s --max-time 60 -H "X-Api-Key: $KEY" "$HOST/api/v1/jobs" -o /tmp/j.json
          python3 -c "
import json,collections
d=json.load(open('/tmp/j.json'))
t=d.get('tasks') or []
print('tasks total =',len(t))
c=collections.Counter((x.get('status'),x.get('type')) for x in t)
for k,v in sorted(c.items()):
    print('  %-10s %-45s %d' % (k[0],k[1],v))
print('--- 非 completed 的任务 ---')
for x in t:
    if x.get('status')!='completed':
        print(json.dumps(x,ensure_ascii=False)[:500])
"
