name: od2-export

# 临时工具: 把本仓库的 Secret「原值」搬运到新仓库(tamd369/cloudtransfer-od2)。
#   * 值不出 CI: 日志里只有 Secret 名 / HTTP 状态 / 字节数 / PATHS_JSON 的脱敏形状
#   * PATHS_JSON 会先做「反向换算」(OneDrive2 版) 再写入
#   * 用完请删掉本 workflow + tools/od2_export.py + Secret OD2_TOKEN
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "目标仓库 owner/name"
        required: true
        default: "tamd369/cloudtransfer-od2"
      names:
        description: "要搬运的 Secret 名(逗号分隔)"
        required: true
        default: ""
      reverse_paths:
        description: "true=PATHS_JSON 做反向换算(OneDrive2 版)"
        required: false
        default: "false"
      prefix:
        description: "反向换算里, 源盘上承载 OneDrive 目录的那一层目录名"
        required: false
        default: "onedrive"
      apply:
        description: "true=真写; false=只演练"
        required: false
        default: "false"

concurrency:
  group: od2-export
  cancel-in-progress: false

permissions:
  contents: read

env:
  OD2_TOKEN: ${{ secrets.OD2_TOKEN }}
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
  ALIST_STORAGES: ${{ secrets.ALIST_STORAGES }}
  ALIST_STORAGES_TY: ${{ secrets.ALIST_STORAGES_TY }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN_TAM: ${{ secrets.GH_TOKEN_TAM }}
  TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
  TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
  HALAL_CLIENT_ID: ${{ secrets.HALAL_CLIENT_ID }}
  HALAL_CLIENT_SECRET: ${{ secrets.HALAL_CLIENT_SECRET }}
  HALAL_REFRESH_TOKEN: ${{ secrets.HALAL_REFRESH_TOKEN }}
  TY_AUTH: ${{ secrets.TY_AUTH }}
  TY_CLOUD_ID: ${{ secrets.TY_CLOUD_ID }}
  YDY_AUTHORIZATION: ${{ secrets.YDY_AUTHORIZATION }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装依赖(写 Secret 要 PyNaCl)
        run: pip install --quiet pynacl

      - name: 搬运
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          NAMES: ${{ inputs.names }}
          REVERSE_PATHS: ${{ inputs.reverse_paths }}
          ADD_PREFIX: ${{ inputs.prefix }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -x
          ARGS=""
          [ "$APPLY" = "true" ] && ARGS="$ARGS --apply"
          [ "$REVERSE_PATHS" = "true" ] && ARGS="$ARGS --reverse-paths"
          python3 tools/od2_export.py --repo "$TARGET_REPO" --names "$NAMES" --prefix "$ADD_PREFIX" $ARGS
