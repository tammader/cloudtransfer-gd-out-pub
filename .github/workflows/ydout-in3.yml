name: ydout-in3

# GoogleDrive2/ydout -> OneDrive2/in3, 并把 ydout 里已送达的源文件移到 GoogleDrive2/out3(归档)
#   跨网盘搬运由 rclone 自动「下载到 runner -> 上传到目标」;
#   只在**目标端同名同大小**确认送达后, 才把 ydout 里的源文件同盘移动(move, 秒完成)到 out3。
#   手动触发的流程(无定时)。
# 需要仓库 Secrets: RCLONE_CONF(含 [onedrive2] + [gdrive2]) / PATHS_JSON

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真搬(上传+归档源), false=只演练"
        required: false
        default: "false"
      max_ops:
        description: "本轮最多处理多少个文件"
        required: false
        default: "200"
      max_total_gb:
        description: "本轮总量上限(GB)"
        required: false
        default: "150"
      batch_gb:
        description: "每批搬运量上限(GB)"
        required: false
        default: "8"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      only:
        description: "只处理名字含该子串的文件(留空=全部); 验证时有用"
        required: false
        default: ""

concurrency:
  group: ydout-in3
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1
          df -h / | tail -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"

      - name: 跑搬运(目标远端 -> in3, 送达后把源归档到 out3)
        env:
          APPLY: ${{ inputs.apply || 'false' }}
          MAX_OPS: ${{ inputs.max_ops || '200' }}
          MAX_TOTAL_GB: ${{ inputs.max_total_gb || '150' }}
          BATCH_GB: ${{ inputs.batch_gb || '8' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          ONLY_NAME: ${{ inputs.only }}
        run: |
          set -e
          ARGS="--mode ydout-in3 --max-ops $MAX_OPS --max-total-gb $MAX_TOTAL_GB"
          ARGS="$ARGS --batch-gb $BATCH_GB --budget-min $BUDGET_MIN"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; else echo "(演练模式)"; fi
          python3 tools/gd_relay.py $ARGS
