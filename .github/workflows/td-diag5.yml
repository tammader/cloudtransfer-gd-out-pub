name: td-diag5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: dump discarded 任务原文
        env:
          HOST: ${{ secrets.TELDRIVE_API_HOST }}
          KEY: ${{ secrets.TELDRIVE_API_KEY }}
        run: |
          set +e
          curl -s --max-time 60 -H "X-Api-Key: $KEY" "$HOST/api/v1/jobs" -o /tmp/j.json
          jq '.tasks[] | select(.status == "discarded")' /tmp/j.json
