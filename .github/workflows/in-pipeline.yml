name: in-pipeline

# 上游盘 /in 的一条龙: ① 清理 ② 跨系统判重 -> 待下载清单
#
#   为什么合并: 原来 halal-clean(私有仓库 tamd258/cloudtransfer-speedtest) 和 in-dedup(本仓库)
#   靠"cron 错开 20 分钟"保证顺序, 但 GitHub schedule 实测**漂移 4~6 小时** -> 顺序不保证,
#   会出现"拿旧脏名字生成队列"(2026-10-01 真实发生过: 清理改名 7 个 -> 队列失效)。
#   合并成同一个 job 的两个步骤 = 严格串行, 顺序由**步骤顺序**保证, 不再看时间脸色。
#
#   本文件取代(并请在仓库里删掉)以下两个:
#     - .github/workflows/in-dedup.yml        (本仓库, 已并入)
#     - .github/workflows/halal-clean.yml     (私有仓库, 请停用/删除, 否则两处同时清理会撞名)
#
#   步骤: ① halal_clean.py 清理 /in 与 /in2(提 >200MB 到根 + 去杂质改名 + 内部去重)
#         ② in_dedup.py    跨系统判重 -> 已归档的移出 /out, 其余写成 in_queue.tsv(手机端下载清单)
#
#   依赖: 全是本仓库已有的 Secrets —— HALAL_CLIENT_ID/SECRET/REFRESH_TOKEN + RCLONE_CONF + PATHS_JSON
#   用法: 默认演练(--dry); schedule 走执行模式; 手动触发默认演练(安全)
#   注意: 两步同在一个 job, **清理失败就不生成新队列**(有意为之 —— 宁可保留上一份一致的队列,
#         也不要拿"清了一半"的状态去出清单)

on:
  # 每 3 小时一次 (UTC 每 3 小时的 :00 -> 北京 02/05/08/11/14/17/20/23 点)
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真执行, false=只演练"
        required: false
        default: "false"
      max_ops:
        description: "① 清理的单批上限"
        required: false
        default: "400"

concurrency:
  group: in-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 路径真值走加密 Secret; 日志里只显示 ***
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone version | head -1

      - name: ① 清理上游 /in + /in2
        env:
          HALAL_CLIENT_ID: ${{ secrets.HALAL_CLIENT_ID }}
          HALAL_CLIENT_SECRET: ${{ secrets.HALAL_CLIENT_SECRET }}
          HALAL_REFRESH_TOKEN: ${{ secrets.HALAL_REFRESH_TOKEN }}
          APPLY: ${{ inputs.apply || 'true' }}
          MAX_OPS: ${{ inputs.max_ops || '400' }}
        run: |
          set -x
          ARGS="--roots /in,/in2 --in-place-roots /in2 --max-ops $MAX_OPS"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python3 tools/halal_clean.py $ARGS

      - name: ② 跨系统判重 -> 待下载清单
        env:
          HALAL_CLIENT_ID: ${{ secrets.HALAL_CLIENT_ID }}
          HALAL_CLIENT_SECRET: ${{ secrets.HALAL_CLIENT_SECRET }}
          HALAL_REFRESH_TOKEN: ${{ secrets.HALAL_REFRESH_TOKEN }}
          APPLY: ${{ inputs.apply || 'true' }}
        run: |
          set -x
          ARGS="--max-ops 800 --budget-min 20"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python3 tools/in_dedup.py $ARGS
