name: douyin-upload-check

# 验证用：用仓库内现成清单(本机已抓的真实直链) → 下载 → 补丁 rclone 上传到 teldrive
# 的测试目录 douyin-test/，验证云端上传链路。不占正式备份目录，不进并发组太长。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 装补丁版 rclone
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rdl
          gh release download td-rclone-v1.75.4 --repo tammader/cloudtransfer-gd-out \
            --pattern 'rclone-linux-amd64' --dir /tmp/rdl --clobber
          sudo install -m 0755 /tmp/rdl/rclone-linux-amd64 /usr/local/bin/rclone
          rclone help backend teldrive > /dev/null && echo "teldrive backend OK"

      - name: 添加 teldrive 远端
        env:
          TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
          TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
        run: |
          rclone config create teldrive teldrive \
            api_host="$TELDRIVE_API_HOST" api_key="$TELDRIVE_API_KEY" > /dev/null
          rclone lsd teldrive: 2>&1 | head -5 || echo "(列不出)"

      - name: 下载首个 + 上传到 douyin-test/
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DY_WORK: /tmp/dywork
          DY_TD_DST: teldrive:douyin-test
        run: |
          set -euo pipefail
          cp tools/_douyin_fav_sample.json /tmp/favsample.json
          export DOUYIN_FAV_JSON=/tmp/favsample.json
          python3 tools/douyin_teldrive.py --apply --max-files 1 --budget-min 8 --max-total-gb 1 --preview 5
          echo "=== 目标端核对 ==="
          rclone lsjson teldrive:douyin-test -R --files-only 2>&1 | head -20
