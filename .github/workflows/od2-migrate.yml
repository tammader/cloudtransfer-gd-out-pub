name: od2-migrate

# OneDrive2 退役: 把 PATHS_JSON / PATHS_JSON_TD 里所有指向 OneDrive2 的路径改到
# GoogleDrive2 的 onedrive 目录下, 并把容量卡片里的 OneDrive2 行摘掉。
#
#   * 只改 Secret, 不动任何数据; 演练默认, 加 apply=true 才写回
#   * 值不出 CI: 日志里只有 key 名与脱敏形状(<r:hash8> / <m:hash8>)
#   * 盘点模式(hashmap=true): 打印 CI 的 rclone 远端名 / alist 挂载名的 sha1[:8],
#     本机拿候选名对一下就知道是哪一个, 不泄露真名
#
# 需要 Secrets: PATHS_JSON / PATHS_JSON_TD / RCLONE_CONF / ALIST_STORAGES_TY / ALIST_STORAGES / GH_TOKEN

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true=把新字典写回 Secret; false=只演练"
        required: false
        default: "false"
      hashmap:
        description: "true=只打印远端名/挂载名的脱敏探针"
        required: false
        default: "false"
      probe:
        description: "true=打印几条搬运链的两端(远端脱敏, 目录名保留), 不写任何东西"
        required: false
        default: "false"
      old_remote:
        description: "旧 rclone 远端名"
        required: false
        default: "onedrive2"
      old_mount:
        description: "旧 alist 挂载路径"
        required: false
        default: "/OneDrive2"
      new_remote:
        description: "新 rclone 远端名(GoogleDrive2)"
        required: false
        default: "gdrive2"
      new_mount:
        description: "新 alist 挂载路径(GoogleDrive2)"
        required: false
        default: "/GoogleDrive2"
      new_prefix:
        description: "新盘上的目录名"
        required: false
        default: "onedrive"

concurrency:
  group: od2-migrate
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  PATHS_JSON_TD: ${{ secrets.PATHS_JSON_TD }}
  ALIST_STORAGES_TY: ${{ secrets.ALIST_STORAGES_TY }}
  ALIST_STORAGES: ${{ secrets.ALIST_STORAGES }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN_TAM: ${{ secrets.GH_TOKEN_TAM }}
  OLD_REMOTE: ${{ inputs.old_remote || 'onedrive2' }}
  OLD_MOUNT: ${{ inputs.old_mount || '/OneDrive2' }}
  NEW_REMOTE: ${{ inputs.new_remote || 'gdrive2' }}
  NEW_MOUNT: ${{ inputs.new_mount || '/GoogleDrive2' }}
  NEW_PREFIX: ${{ inputs.new_prefix || 'onedrive' }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 写 rclone 配置(只为列远端名做探针)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "远端段数: $(grep -c '^\[' ~/.config/rclone/rclone.conf)"

      - name: 装依赖(写 Secret 要 PyNaCl)
        run: pip install --quiet pynacl

      - name: 打印搬运链两端(probe)
        if: inputs.probe == 'true'
        run: python3 tools/path_probe.py

      - name: 跑迁移
        if: inputs.probe != 'true'
        run: |
          set -x
          ARGS=""
          [ "${{ inputs.apply }}" = "true" ] && ARGS="$ARGS --apply"
          [ "${{ inputs.hashmap }}" = "true" ] && ARGS="$ARGS --hashmap"
          python3 tools/od2_migrate.py $ARGS
