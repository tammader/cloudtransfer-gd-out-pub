name: gd2-teldrive

# gdrive2 -> Teldrive(Telegram) 冷备份   【公开仓库版, Actions 不计费】
#
# 为什么搬到公开仓库: 私有仓库跑 350 分钟的 job 要烧额度; 公开仓库免费。
# 代价是日志任何人可读, 所以:
#   * 脚本开头 logmask.install() 把文件名/目录名/远端名换成 <file:hash>/<path:hash>;
#   * rclone 的输出被 Popen 接进 Python 再打印, 保证也过一遍脱敏(不能直接继承 fd);
#   * 真实路径只存在 Secret PATHS_JSON_TD / PATHS_JSON 里, 源码与日志零明文。
# 报告图仍然发给 Telegram, 图里带目录名(那是私聊, 不进日志)。
#
#   Teldrive 是跑在 Unikraft 上的 Telegram 网盘, 走 HTTP API。
#   ⚠️ 官方 rclone **没有** teldrive backend, 必须装 tgdrive/rclone fork。
#      fork 是官方版的超集, 所以同一个二进制 gdrive2 / teldrive 都能连。
#   单向: 源不动, 同名同大小跳过。
#   ⚠️ 默认「真传」。只有手动 dispatch 时显式填 apply=false 才演练。
#      必须默认真传: schedule 触发时 inputs 上下文是空的, 表达式 ${inputs.apply || 'x'}
#      只会拿到兜底值 x; 以前兜底写的 'false', 结果每 6 小时定时跑的全是演练。
#   单轮限量(max_transfer_gb) + 时间预算(budget_min), 到点优雅收工下次继续。
#   报告: GT_REPORT 指向的路径, 含未完成明细(下次会重挑)。
#
# 需要 Secrets: RCLONE_CONF / PATHS_JSON / PATHS_JSON_TD /
#               TELDRIVE_API_HOST / TELDRIVE_API_KEY / TG_TOKEN / TG_CHAT_ID / GH_TOKEN
# 与 yd2-teldrive 错开: 本条 6:40/18:40 UTC, 那条 0:20/12:20 UTC(都 12 小时一轮)。
#
# ⚠️ 2026-10-22 起默认「落地模式」(stage=true): 先把文件下载到 runner 磁盘, 再从本地
#    传到 Teldrive, 一批 10GB 循环。原因见 tools/gd2_teldrive_backup.py 里
#    「传输(落地模式)」那段: 老的流式直传会让读端和慢写端互相拖死, 实测一轮 475 次
#    504、完成 0 个文件。要回到老行为只能手动 dispatch 时填 stage=false。

on:
  # 每 12 小时 (UTC 6:40 / 18:40 = 北京 14:40 / 次日 2:40)
  #
  # 为什么是 12 小时:
  #   单轮预算 270 分钟(4.5h), 加上装环境/列目录开销约 15 分钟, 一轮实际占 4.75h。
  #   12 小时周期 => 每轮之间空出约 7 小时, 足够 Teldrive 侧消化落库、清 session、
  #   恢复 API 可用性。4.5h 连轴转(每 6 小时)会把目标端一直压在满负荷上,
  #   实测每轮收尾复核都会撞 `connection refused`。
  #
  # 历史上还和 yd2-teldrive 共用过 concurrency group `teldrive-upload`(互斥排队),
  #   yd2 一轮约 4.5 小时, 6 小时周期下 gd2 根本排不进(2026-10-22 #14 排队等了 4 小时)。
  #   yd2 目前是停用状态, 但这条 12 小时的间隔依然成立 —— 恢复 yd2 时不用再改。
  #   teldrive 那条 Telegram 管道总共 ≈1.9MiB/s, 两条同时跑也不会更快,
  #   错峰只是把排队空转的时间还回来。
  #
  # 2026-10-30 调整: yd2-teldrive 已手动停用(等 gd2 全部传完再启用), 整条
  #   `teldrive-upload` 队列空出来了, 所以 gd2 从每 12 小时 2 轮加密到每 6 小时 4 轮,
  #   把原本空转的 15 小时用起来。4 轮 x 270min ≈ 18h + 装环境开销, 24h 基本填满。
  #
  # 2026-11-03 调整: 改回**每天 2 轮**(UTC 6:40 / 18:40 = 北京 14:40 / 次日 2:40)。
  #   实测每轮 270 分钟能稳定传 54 个文件 / 约 28.6 GB, 4 轮连轴转的边际收益很低,
  #   却把 runner 和 Teldrive 端一直占满 —— 每轮收工时都撞上 Teldrive API
  #   `connection refused`(run #47/#48 都见到), 收尾复核拿不到数据。
  #   拉开到 12 小时间隔后: 每轮之间留约 9 小时空档, Teldrive 侧有充分时间
  #   落库 / 退 session / 恢复 API, 下一轮开跑时连得上。
  #   日传量从 ~114 GB 降到 ~57 GB, 但单轮成功率优先。
  schedule:
    - cron: "40 6,18 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真传(默认), false=只演练看计划(不传任何东西)"
        required: false
        default: "true"
      max_transfer_gb:
        description: "本轮传输总量上限(GB); 实测 ~8MiB/s, 270 分钟约 130GB, 默认 150 够用"
        required: false
        default: "150"
      max_file_gb:
        description: "单文件大小上限(GB), 默认 1.5; 超过的直接跳过并写进报告。依据: 管道 ~125KiB/s, 1.5GB 需 3.4h 能传完, 2GB 需 4.7h 超过预算传不完(会每轮重传、吃光预算、让小文件饿死)。0=不限制"
        required: false
        default: "1.5"
      budget_min:
        description: "本轮时间预算(分钟)。job 硬上限 350, 默认 270 留 80 分钟收尾(曾有一轮卡到 350 被强杀)"
        required: false
        default: "270"
      transfers:
        description: "并发文件数。求稳 3; Telegram 侧并发高容易 504/限流"
        required: false
        default: "3"
      chunk_mb:
        description: "Teldrive 分片大小(MB), 默认 4。除 8MiB 请求体上限(9Mi 起 413)外, 真正约束是网关 60s 无数据超时: 一片必须在 60s 内传完, 否则 504 后从第0字节重传。需最低速率 = 分片MiB*1024/60 KiB/s (4Mi=68, 6Mi=102, 8Mi=136); 2026-10-30 实测 8Mi 在 ~133KiB/s 下每个文件都死在 ~22MiB, 4Mi 连续 17 分钟 0 次 504"
        required: false
        default: "4"
      max_dirs:
        description: "本轮最多备份几个文件夹; 0=不限(按总量上限收工)"
        required: false
        default: "0"
      stage:
        description: "true=落地模式(默认, 先下载到 runner 磁盘再传, 2026-10-22 起); false=老的流式直传, 必 504, 只做对照"
        required: false
        default: "true"
      stage_batch_gb:
        description: "落地模式每批大小(GB): 下载这么多 -> 传上去 -> 删本地, 再下一批。默认 10"
        required: false
        default: "10"
      video_only:
        description: "true=只传视频文件; false=整个文件夹都传(含字幕/图片)"
        required: false
        default: "false"
      only:
        description: "只备份这一个文件夹(相对路径, 留空=自动扫描); 调试用"
        required: false
        default: ""

concurrency:
  # ⚠️ 与 yd2-teldrive **共用同一个组**: 同一个 teldrive 实例 + 同一条 Telegram 通道
  # (≈1.9 MiB/s), 同时跑只会互相拖慢并撞 409/504。共用组 = 排队互斥。
  group: teldrive-upload
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 路径真值走加密 Secret; 日志里只会显示 ***
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  PATHS_JSON_TD: ${{ secrets.PATHS_JSON_TD }}
  # 公开仓库: 日志脱敏强制开启(文件名/路径 -> 哈希标签)
  LOG_MASK: "1"
  # 固定用这个 fork 版本(内含 teldrive backend)
  RCLONE_FORK_VERSION: "v1.75.4"
  # 收尾出图发 Telegram(跟 flow-status 同一套: SVG -> PNG -> sendPhoto)
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  # 备份统计落点; 出图脚本读它。目录跟备份脚本的 GT_WORK 默认一致
  TD_STATS_JSON: /tmp/gd2teldrive/stats.json

jobs:
  gd2-teldrive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # ---- 自愈 1/2: 实例存活检查(第一步, 不需要 rclone) ----
      # 2026-11-04 加。实例跑久了 MTProto 连接会卡死, 表现为上传 100% 504,
      # 但 API / DB 全都正常(state 一直是 running)。这里先确保实例没被挂起;
      # 真正的判死活在备份前那一步做(必须真传一个文件才算数)。
      - name: 实例自检 + 唤醒(Unikraft)
        continue-on-error: true
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: ${{ secrets.UKC_METRO }}
          UUID: ${{ secrets.UKC_INSTANCE_UUID }}
        run: |
          set +e
          B64=$(printf '%s' "$UKC_TOKEN" | base64 -w0)
          BASE="https://api.$UKC_METRO.unikraft.cloud/v1/instances/$UUID"
          get_state() {
            curl -s --max-time 30 -H "Authorization: Bearer $B64" "$BASE" \
              | jq -r '.data.instances[0].state // "unknown"'
          }
          S=$(get_state)
          echo "实例初始状态: $S"
          if [ "$S" != "running" ]; then
            echo "不是 running -> 尝试启动"
            curl -s --max-time 30 -X PUT -H "Authorization: Bearer $B64" "$BASE/start" >/dev/null
            for i in $(seq 1 45); do
              sleep 2
              S=$(get_state)
              [ "$S" = "running" ] && break
            done
            echo "启动后状态: $S"
          fi

      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装中文字体 + SVG 转 PNG 工具
        run: |
          # 收尾那步要用 rsvg-convert 把报告图转成 PNG 发 Telegram;
          # 中文字体现在不装, 图上标题就是一排豆腐块
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk librsvg2-bin
          rsvg-convert --version
          fc-list :lang=zh | head -3

      - name: 环境自检(磁盘/内存/时间)
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== CPU/内存 ====="; nproc; free -h || true
          echo "===== UTC / 北京 ====="; date -u; TZ=Asia/Shanghai date

      - name: 装 rclone（补丁版，允许 8Mi 小分片，绕开 Unikraft 8MiB 请求体上限）
        run: |
          set -euo pipefail
          # 上游 fork 把分片强制 ≥64MiB 并对齐 16MiB, 在这里必然 413;
          # 用 build-td-rclone.yml 编出来的补丁版(下限 4MiB / 对齐 1MiB)。
          # 资产托管在**公开** release(tamd258/rclone), 匿名 curl 即可下载;
          # 不再依赖私有仓库 tammader/cloudtransfer-gd-out, 也不再依赖 GH_TOKEN
          # (2026-10-24 那次全线失败就是 GH_TOKEN 401 导致拉不到补丁版)。
          T="td-rclone-${RCLONE_FORK_VERSION}"
          URL="https://github.com/tamd258/rclone/releases/download/${T}/rclone-linux-amd64"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/rclone-td "$URL"
          install -m 0755 /tmp/rclone-td /usr/local/bin/rclone
          echo "===== 版本 ====="
          rclone version > /tmp/td_ver.txt
          head -3 /tmp/td_ver.txt
          echo "===== teldrive backend 自检(装错会在这里炸) ====="
          # 注意: 别用 `rclone help ... | head`, 有 pipefail 时 SIGPIPE 会让这步以 141 失败
          rclone help backend teldrive > /tmp/td_help.txt
          head -14 /tmp/td_help.txt

      - name: 检查必备 Secret
        env:
          TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
          TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          PATHS_JSON_TD: ${{ secrets.PATHS_JSON_TD }}
        run: |
          miss=0
          [ -n "$TELDRIVE_API_KEY" ]  || { echo "!! 缺 Secret TELDRIVE_API_KEY";  miss=1; }
          [ -n "$TELDRIVE_API_HOST" ] || { echo "!! 缺 Secret TELDRIVE_API_HOST"; miss=1; }
          [ -n "$RCLONE_CONF" ]       || { echo "!! 缺 Secret RCLONE_CONF";       miss=1; }
          [ -n "$PATHS_JSON_TD" ]     || { echo "!! 缺 Secret PATHS_JSON_TD (GT_SRC/GT_DST/GT_REPORT)"; miss=1; }
          if [ "$miss" = "1" ]; then
            echo ""
            echo "怎么拿 TELDRIVE_API_KEY: 打开 Teldrive 网页 → 登录 → Settings → API keys → 新建 → 复制"
            exit 1
          fi
          echo "必备 Secret 齐全"

      - name: 写 rclone 配置 (gdrive2 等现有远端)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "现有远端: $(grep -c '^\[' ~/.config/rclone/rclone.conf) 段"

      - name: 添加 teldrive 远端
        env:
          TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
          TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
        run: |
          set -euo pipefail
          rclone config create teldrive teldrive \
            api_host="$TELDRIVE_API_HOST" \
            api_key="$TELDRIVE_API_KEY" >/dev/null
          echo "远端清单:"
          rclone listremotes
          echo "===== 连通性测试 ====="
          rclone lsd teldrive: 2>&1 | head -10 || echo "(根目录为空或列不出, 继续)"

      # ---- 自愈 2/2: 上传通路自检, 不通就重启实例 ----
      # 判据必须是真的传一个 1MiB 文件 —— state=running 不代表能上传
      # (2026-11-04 那次就是 running 但上传 100% 504, initConnection 重试耗尽)。
      # 放在这里而不是第一步: 上面第 4 步才装 rclone, 第 7 步才配好 teldrive 远端。
      - name: 上传自检 + 自愈重启
        id: selfheal
        continue-on-error: true
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: ${{ secrets.UKC_METRO }}
          UUID: ${{ secrets.UKC_INSTANCE_UUID }}
        run: |
          set +e
          probe() {
            dd if=/dev/urandom of=/tmp/hp.bin bs=1M count=1 status=none
            TS=$(date +%s)
            rclone copyto /tmp/hp.bin "teldrive:diag-upload/heal-$TS.bin" \
              --teldrive-chunk-size 1Mi --teldrive-hash-enabled=false \
              --multi-thread-streams 0 --transfers 1 --checkers 1 \
              --retries 1 --low-level-retries 2 --timeout 180s -q 2>/dev/null
            RC=$?
            [ "$RC" = "0" ] && rclone deletefile "teldrive:diag-upload/heal-$TS.bin" >/dev/null 2>&1
            return $RC
          }

          echo "=== 上传自检(1MiB) ==="
          if probe; then
            echo "上传正常, 不重启"
            echo "healed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "!!! 上传失败 -> 重启 Unikraft 实例"
          B64=$(printf '%s' "$UKC_TOKEN" | base64 -w0)
          BASE="https://api.$UKC_METRO.unikraft.cloud/v1/instances/$UUID"
          get_state() {
            curl -s --max-time 30 -H "Authorization: Bearer $B64" "$BASE" \
              | jq -r '.data.instances[0].state // "unknown"'
          }
          curl -s --max-time 30 -X PUT -H "Authorization: Bearer $B64" "$BASE/stop" >/dev/null
          for i in $(seq 1 40); do sleep 2; [ "$(get_state)" = "stopped" ] && break; done
          echo "停止后: $(get_state)"
          curl -s --max-time 30 -X PUT -H "Authorization: Bearer $B64" "$BASE/start" >/dev/null
          for i in $(seq 1 60); do sleep 2; [ "$(get_state)" = "running" ] && break; done
          echo "启动后: $(get_state)"
          sleep 10

          echo "=== 重启后复测 ==="
          if probe; then
            echo "自愈成功, 继续备份"
            echo "healed=true" >> "$GITHUB_OUTPUT"
          else
            echo "!!! 自愈失败 —— 备份大概率仍传不上去, 但照常继续跑(不中断)"
            echo "healed=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: 跑 gd2 -> teldrive 备份
        env:
          # schedule 触发时 inputs 为空 -> 走兜底 'true'; 手动 dispatch 时以填的值为准
          APPLY: ${{ inputs.apply || 'true' }}
          # 触发来源, 打进报告图副标题, 一眼分清定时/手动
          TD_EVENT: ${{ github.event_name }}
          MAX_GB: ${{ inputs.max_transfer_gb || '150' }}
          MAX_FILE_GB: ${{ inputs.max_file_gb || '1.5' }}
          BUDGET: ${{ inputs.budget_min || '270' }}
          TRANSFERS: ${{ inputs.transfers || '3' }}
          CHUNK: ${{ inputs.chunk_mb || '4' }}
          MAX_DIRS: ${{ inputs.max_dirs || '0' }}
          VIDEO_ONLY: ${{ inputs.video_only || 'false' }}
          ONLY: ${{ inputs.only || '' }}
          STAGE: ${{ inputs.stage || 'true' }}
          STAGE_BATCH_GB: ${{ inputs.stage_batch_gb || '10' }}
          # 开跑前清理上一轮残留的 open upload session(409 冲突的根源), 需要这两个
          TELDRIVE_API_HOST: ${{ secrets.TELDRIVE_API_HOST }}
          TELDRIVE_API_KEY: ${{ secrets.TELDRIVE_API_KEY }}
        run: |
          set -x
          # 用数组而不是拼字符串: 拼字符串时 --only 'X' 里的引号不会被再次解析,
          # 路径带空格会被 shell 拆成两个参数(argparse: unrecognized arguments)。
          ARGV=(--max-transfer-gb "$MAX_GB" --max-file-gb "$MAX_FILE_GB" --budget-min "$BUDGET"
                --transfers "$TRANSFERS" --chunk-mb "$CHUNK" --max-dirs "$MAX_DIRS"
                --stage-batch-gb "$STAGE_BATCH_GB")
          if [ "$APPLY" = "true" ]; then ARGV+=(--apply); fi
          if [ "$VIDEO_ONLY" = "true" ]; then ARGV+=(--video-only); fi
          # 默认落地模式(下载到 runner 磁盘再传); 只有显式 stage=false 才回到流式直传
          if [ "$STAGE" = "false" ]; then ARGV+=(--no-stage); fi
          if [ -n "$ONLY" ]; then ARGV+=(--only "$ONLY"); fi
          python3 tools/gd2_teldrive_backup.py "${ARGV[@]}"

      - name: 出报告图并发 Telegram
        if: always()
        run: |
          # 统计文件不存在也照样出图(画一张「没跑出统计」的告警卡片),
          # 这样备份步骤自己炸了也能收到通知
          python3 tools/gd2_teldrive_report.py || echo "!! 出图/发 TG 失败(不影响备份结果)"

      - name: 收尾(报剩余空间)
        if: always()
        run: df -h / | tail -1
